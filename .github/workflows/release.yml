name: Release Windows installer

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, test, and publish
    runs-on: windows-2025

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Verify tag and project versions
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          [xml]$project = Get-Content -LiteralPath "src/GitHubReleaseWatcher/GitHubReleaseWatcher.csproj"
          $projectVersion = [string]$project.Project.PropertyGroup.Version

          if ($tagVersion -ne $projectVersion) {
            throw "Tag version '$tagVersion' does not match project version '$projectVersion'."
          }

      - name: Restore dependencies
        run: dotnet restore GitHubReleaseWatcher.slnx

      - name: Run tests
        run: dotnet test GitHubReleaseWatcher.slnx -c Release --no-restore

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1

      - name: Prepare release assets
        id: assets
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "artifacts/installer" -Filter "GitHubReleaseWatcher-Setup-*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $checksumPath = "$($installer.FullName).sha256"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          "installer=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release '$env:GITHUB_REF_NAME' already exists."
          }

          gh release create $env:GITHUB_REF_NAME `
            "${{ steps.assets.outputs.installer }}" `
            "${{ steps.assets.outputs.checksum }}" `
            --verify-tag `
            --generate-notes `
            --latest `
            --title "GitHub Release Watcher $env:GITHUB_REF_NAME"
